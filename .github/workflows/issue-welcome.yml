name: Issue Welcome & Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome-and-label:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome reporter and apply triage label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ["triage needed"],
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                "Thanks for opening this issue! 👋",
                "",
                "Please confirm your report follows the issue templates:",
                "- Bug: https://github.com/UmbrellaDocs/adoceditor/blob/main/ISSUE_TEMPLATE/bug_report.md",
                "- Feature: https://github.com/UmbrellaDocs/adoceditor/blob/main/ISSUE_TEMPLATE/feature_request.md",
                "- Question: https://github.com/UmbrellaDocs/adoceditor/blob/main/ISSUE_TEMPLATE/question.md",
                "",
                "Please redact private/sensitive data and provide a minimal reproducible example when possible."
              ].join("\n")
            });
